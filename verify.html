<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>官方验证 · 白桦 BIRCH</title>
<meta name="description" content="白桦官方验真——输入作品随附官方码，核验正品与查询次数（本页不含下单购买）。">
<link rel="stylesheet" href="css/style.css">
<style>
  .vf{max-width:520px;margin:0 auto}
  .vf input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;
    font-size:15px;background:#fff;letter-spacing:.08em;margin-bottom:10px}
  .vf .go{width:100%;padding:12px 0;border:none;border-radius:12px;background:var(--green);
    color:#fff;font-size:15px;letter-spacing:.2em;cursor:pointer}
  .r{margin-top:22px;background:rgba(255,255,255,.8);border:1px solid var(--line);
    border-radius:16px;padding:18px}
  .r .t{font-family:var(--serif);font-size:17px;letter-spacing:.12em;color:var(--green);margin-bottom:8px}
  .r .st{font-size:12px;color:var(--ink2);margin-bottom:10px}
  .r .nm{font-size:16px;color:var(--ink);margin-bottom:4px}
  .r .msg{font-size:13px;color:var(--ink2);line-height:1.9;white-space:pre-wrap;border-left:2px solid var(--gold);padding-left:10px}
  .r img{width:100%;max-height:340px;object-fit:cover;border-radius:12px;margin-top:10px}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <a class="brand" href="index.html">白桦 · BIRCH</a>
  <nav>
    <a href="index.html">首页</a>
    <a href="gallery.html">臻品橱窗</a>
    <a href="studio.html">测石定制</a>
    <a href="verify.html">官方验证</a>
  </nav>
</div></header>

<section class="hero"><h1>官方验证</h1><p>输入作品随附卡上的官方码（ID），核验正品与查询次数</p></section>

<section class="sec"><div class="wrap vf">
  <input id="vc" placeholder="如 MSDL2V8W-EFNU0K" autocomplete="off">
  <button class="go" id="vgo" type="button">验 真</button>
  <div class="r" id="vres" style="display:none"></div>
</div></section>

<footer class="foot"><div class="wrap">白桦水晶定制工作室 · birchstudio.cn</div></footer>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script>
(function () {
  var inp = document.getElementById('vc'), btn = document.getElementById('vgo'), res = document.getElementById('vres');
  var qp = new URLSearchParams(location.search);
  var ac = qp.get('c') || qp.get('code') || '';
  if (ac) { inp.value = ac; setTimeout(function () { btn.click(); }, 260); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  btn.addEventListener('click', function () {
    var code = inp.value.trim();
    if (!code) return;
    res.style.display = 'block';
    res.innerHTML = '<p style="color:var(--ink2)">查询中…</p>';
    if (!window.sbB) { res.innerHTML = '<p>桦库配置缺失</p>'; return; }
    sbB('records?select=*&id=eq.' + encodeURIComponent(code)).then(function (rows) {
      var r = rows && rows[0];
      if (!r) { res.innerHTML = '<p style="color:var(--ink2)">未查询到该官方码，请核对后重试</p>'; return; }
      var first = Number(r.verify_count || 0) < 1;
      var img = window.bImg(r.image_url);
      var html = '<div class="t">' + (first ? '✓ 首次验证 · 白桦正品' : '⚠ 多次验证 · 请留意来源') + '</div>' +
        '<div class="st">官方码：' + esc(r.id) + (r.batch_no ? ' · 专属编号：' + esc(r.batch_no) : '') +
        ' · 已查询 ' + (Number(r.verify_count || 0) + 1) + ' 次（本次）</div>' +
        '<div class="nm">' + esc(r.product_name || '白桦定制') + '</div>' +
        (r.message && r.message !== '生成防伪码自动创建' ? '<div class="msg">' + esc(r.message) + '</div>' : '');
      if (img) html += '<img src="' + esc(img) + '" alt="作品图" onerror="this.style.display=\'none\'">';
      res.innerHTML = html;
      try {
        var cfg = window.BIRCH;
        fetch(cfg.url + '/rest/v1/rpc/inc_verify', {
          method: 'POST',
          headers: { apikey: cfg.anon, Authorization: 'Bearer ' + cfg.anon, 'Content-Type': 'application/json' },
          body: JSON.stringify({ p_code: code })
        }).catch(function () {});
      } catch (e) {}
    }).catch(function () { res.innerHTML = '<p style="color:var(--ink2)">查询服务暂不可用，请稍后再试</p>'; });
  });
  inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') btn.click(); });
})();
</script>
</body>
</html>
