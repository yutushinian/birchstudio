<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>后台 · 顾客授权分享库 · 白桦</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="css/style.css">
<style>
  .t{max-width:900px;margin:0 auto}
  table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
  th,td{border-bottom:1px solid var(--line);padding:10px 12px;text-align:left;font-size:13px;vertical-align:top}
  th{background:rgba(74,124,89,.08);color:var(--green);font-weight:400}
  td.cmt{min-width:200px;color:var(--ink)}
  .note{font-size:12px;color:var(--ink2);margin:10px 0;line-height:1.9}
  .f{display:flex;gap:10px;align-items:center;margin-bottom:12px}
  .f select{padding:8px;border:1px solid var(--line);border-radius:8px;background:#fff}
  .btn{padding:7px 14px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--green);cursor:pointer;font-size:12px}
  #ark{display:none;margin-top:16px}
</style>
</head>
<body>
<section class="sec"><div class="wrap t">
  <div class="hero" style="padding:24px 0"><h1>顾客授权分享库</h1><p>每一行 = 一条授权分享（前台图片墙 + 评论弹幕）</p></div>
  <div class="note">＊ 当前为只读浏览/复制；上架/下架（approved）请在桦库 Supabase Table Editor 操作（shares 表 approved 字段），或部署带 service-role 的管理函数后接入。</div>
  <div class="f">
    <select id="flt"><option value="all">全部</option><option value="on">仅上架</option><option value="off">仅下架</option></select>
    <button class="btn" onclick="loadShares()">刷新</button>
    <button class="btn" onclick="keyHint()">存档</button>
  </div>
  <div id="tb"><p style="color:var(--ink2)">加载中…</p></div>
  <div id="ark"><h2 style="font-size:15px;color:var(--green);margin:8px 0">操作存档（fftt0227）</h2><div id="ar"></div></div>
</div></section>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script>
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function loadShares(){
  var f=document.getElementById('flt').value;
  sbB('shares?select=*&order=created_at.desc&limit=100').then(function(rs){
    rs=(rs||[]).filter(function(s){return f==='all'||(f==='on'? s.approved!==false : s.approved===false);});
    var tb=document.getElementById('tb');
    if(!rs.length){tb.innerHTML='<p style="color:var(--ink2)">暂无数据（请先执行桦库 shares SQL）</p>';return;}
    var h='<table><tr><th>状态</th><th>品名/编号</th><th>评论（弹幕）</th><th>理念</th><th>图片</th><th>立减</th><th>时间</th><th>码</th></tr>';
    rs.forEach(function(s){
      h+='<tr><td>'+(s.approved===false?'已下架':'上架中')+'</td><td>'+esc(s.name||'—')+(s.batch?'<br><small>'+esc(s.batch)+'</small>':'')+'</td>'+
      '<td class="cmt">'+esc(s.comment||'（未填）')+'</td><td style="max-width:200px;color:var(--ink2)">'+esc(String(s.idea||'').slice(0,80))+'</td>'+
      '<td>'+esc(String(s.img||'—').slice(0,30))+'</td><td>'+(Number(s.discount)>0?'¥'+s.discount:'—')+'</td>'+
      '<td>'+esc(String(s.created_at||'').slice(0,16))+'</td><td>'+esc(s.code||'')+'</td></tr>';
    });
    h+='</table>';
    tb.innerHTML=h;
  }).catch(function(){document.getElementById('tb').innerHTML='<p style="color:var(--ink2)">读取失败</p>';});
}
var ab='';
function keyHint(){}
document.addEventListener('keyup',function(e){
  ab=(ab+e.key).slice(-8);
  if(String(ab).toLowerCase()==='fftt0227'){ab='';document.getElementById('ark').style.display='block';
    sbB('archives?select=*&order=created_at.desc&limit=50').then(function(rs){
      rs=rs||[];var ar=document.getElementById('ar');
      if(!rs.length){ar.innerHTML='暂无存档';return;}
      ar.innerHTML='<table><tr><th>时间</th><th>操作</th><th>内容</th></tr>'+rs.map(function(x){
        return '<tr><td>'+esc(String(x.created_at||'').slice(0,16))+'</td><td>'+esc(x.op||x.action||'')+'</td><td>'+esc(String(x.meta||x.note||JSON.stringify(x)).slice(0,120))+'</td></tr>';
      }).join('')+'</table>';
    }).catch(function(){});
  }
});
loadShares();
</script>
</body>
</html>
