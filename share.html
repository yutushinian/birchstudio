<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>顾客分享 · 白桦 BIRCH</title>
<meta name="description" content="白桦顾客授权分享——图片墙＋顾客评论弹幕播放。本页不含下单购买。">
<link rel="stylesheet" href="css/style.css">
<style>
  .bar{height:34px;overflow:hidden;border-radius:999px;background:rgba(74,124,89,.1);margin:6px 0 16px;position:relative}
  .bar .tr{display:flex;gap:34px;white-space:nowrap;width:max-content;padding-left:100%;
    animation:dm 46s linear infinite}
  .bar span{font-size:13px;color:var(--green);letter-spacing:.04em}
  @keyframes dm{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}
  .imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
  .imgs button{padding:0;border:none;border-radius:14px;overflow:hidden;cursor:pointer;aspect-ratio:1/1;
    background:#e8f5ef;box-shadow:0 6px 14px rgba(0,0,0,.12)}
  .imgs img{width:100%;height:100%;object-fit:cover;display:block}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <a class="brand" href="index.html">白桦 · BIRCH</a>
  <nav><a href="index.html">首页</a><a href="gallery.html">臻品橱窗</a><a href="studio.html">测石定制</a><a href="verify.html">官方验证</a></nav>
</div></header>

<section class="hero"><h1>顾客分享</h1><p>图片墙 + 弹幕 · 每一条都经本人授权</p></section>

<section class="sec"><div class="wrap">
  <div id="wall"></div>
</div></section>

<footer class="foot"><div class="wrap">白桦水晶定制工作室 · 评论仅经同意后展示</div></footer>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script>
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
(function(){
  var w=document.getElementById('wall');
  sbB('shares?select=*&order=created_at.desc&limit=40').then(function(rows){
    rows=(rows||[]).filter(function(s){return s.approved===undefined||s.approved===true;});
    if(!rows.length){w.innerHTML='<p style="color:var(--ink2)">还没有顾客分享 ✦ 等第一位授权分享出现</p>';return;}
    var dms=rows.filter(function(s){return s.comment;}).map(function(s){return '✦ '+String(s.comment).slice(0,60);});
    var bar=dms.length?'<div class="bar"><div class="tr">'+dms.concat(dms).map(esc).join('')+'</div></div>':'';
    var items=rows.map(function(s,i){
      var src=window.bImg(s.img); if(!src)return'';
      return '<button data-i="'+i+'"><img src="'+esc(src)+'" alt="'+esc(s.name||'作品')+'" loading="lazy" onerror="this.style.display=\'none\'"></button>';
    }).filter(Boolean).join('');
    w.innerHTML=bar+'<div class="imgs">'+items+'</div>';
    w.querySelectorAll('[data-i]').forEach(function(b){
      b.addEventListener('click',function(){
        var s=rows[Number(b.getAttribute('data-i'))];
        if(s)window.openLb(window.bImg(s.img),s.name,s.idea||'');
      });
    });
  }).catch(function(){w.innerHTML='<p style="color:var(--ink2)">桦库读取失败，请确认已执行 shares SQL</p>';});
})();
</script>
</body>
</html>
