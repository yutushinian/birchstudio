<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>测石定制 · 白桦 BIRCH</title>
<meta name="description" content="白桦生辰测石——DeepSeek 方案（具体到每颗石与排列）＋设计理念＋四句绝句，再由通义生成水晶图。不含线上购买。">
<link rel="stylesheet" href="css/style.css">
<style>
  .st2{max-width:640px;margin:0 auto}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  .row .f{flex:1;min-width:150px}
  .row label{display:block;font-size:12px;color:var(--ink2);margin-bottom:4px}
  .row input,.row select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:14px}
  .go2{width:100%;padding:13px 0;border:none;border-radius:12px;background:var(--green);color:#fff;
    font-size:15px;letter-spacing:.2em;cursor:pointer;margin-top:6px}
  .out{margin-top:20px;background:rgba(255,255,255,.85);border:1px solid var(--line);border-radius:16px;padding:18px;white-space:pre-wrap;line-height:1.9}
  .out b{color:var(--green)}
  .out img{width:100%;max-height:480px;object-fit:contain;border-radius:12px;margin-top:12px}
  .warn{font-size:12px;color:var(--ink2);margin-top:10px;line-height:1.8}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <a class="brand" href="index.html">白桦 · BIRCH</a>
  <nav>
    <a href="index.html">首页</a>
    <a href="gallery.html">臻品橱窗</a>
    <a href="studio.html">测石定制</a>
    <a href="verify.html">官方验证</a>
  </nav>
</div></header>

<section class="hero"><h1>测 石 定 制</h1><p>把信息交给 AI 出方案：具体到每颗石与排列 → 设计理念 → 四句绝句 → 通义生成图</p></section>

<section class="sec"><div class="wrap st2">
  <div class="row">
    <div class="f"><label>类型</label>
      <select id="m"><option value="bazi">生辰测石（八字）</option><option value="zod">生肖测石</option>
      <option value="star">星座测石</option><option value="union">合盘测石</option></select></div>
    <div class="f"><label>年份（如 1990，选填）</label><input id="y" placeholder="1990"></div>
  </div>
  <div class="row">
    <div class="f"><label>生肖</label><select id="z">
      <option>子鼠</option><option>丑牛</option><option>寅虎</option><option>卯兔</option><option>辰龙</option><option>巳蛇</option>
      <option>午马</option><option>未羊</option><option>申猴</option><option>酉鸡</option><option>戌狗</option><option>亥猪</option>
    </select></div>
    <div class="f"><label>星座（选填）</label><input id="s" placeholder="如 天蝎"></div>
  </div>
  <div class="row">
    <div class="f"><label>对方星座（合盘选填）</label><input id="s2" placeholder="如 双鱼"></div>
    <div class="f"><label>备注（选填）</label><input id="n" placeholder="关系/偏好"></div>
  </div>
  <button class="go2" id="go" type="button">生成我的测石方案</button>
  <div class="out" id="out" style="display:none"></div>
  <p class="warn">＊ 需桦库已部署 ai-assistant（DeepSeek v4-flash＋通义 Z-Image）并完成 SQL；五行/卦象均为文化意象的表达，不作任何承诺。</p>
</div></section>

<footer class="foot"><div class="wrap">白桦水晶定制工作室 · birchstudio.cn · 定制咨询请联络客服（本页不含线上购买）</div></footer>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script>
(function () {
  var out = document.getElementById('out');
  function sc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  document.getElementById('go').addEventListener('click', function () {
    var m = document.getElementById('m').value;
    var info = {};
    if (m === 'bazi') info = { zod: document.getElementById('z').value, year: document.getElementById('y').value.trim(), note: document.getElementById('n').value.trim() };
    else if (m === 'zod') info = { zod: document.getElementById('z').value };
    else if (m === 'star') info = { sun: document.getElementById('s').value.trim() };
    else info = { a: document.getElementById('s').value.trim(), b: document.getElementById('s2').value.trim(), note: document.getElementById('n').value.trim() };
    out.style.display = 'block';
    out.innerHTML = '小光/小桦正在为你推算方案（约 20-60 秒）…';
    var cfg = window.BIRCH;
    if (!cfg || !cfg.url) { out.innerHTML = '桦库配置缺失'; return; }
    fetch(cfg.url + '/functions/v1/ai-assistant', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mode: 'design', kind: m, info: info, design: { mm: 10, count: 18, color: '#4a7c59' } })
    }).then(function (r) { return r.json(); }).then(function (j) {
      if (!j || !j.ok) { out.innerHTML = sc((j && j.error) || '生成失败，请确认桦库 AI 函数已部署并配置'); return; }
      out.innerHTML = '<b>✦ 设计方案</b>\n' + sc(j.analysis || '') +
        (j.url ? '<img src="' + sc(j.url) + '" alt="水晶图">' : '');
    }).catch(function () { out.innerHTML = '请求失败，请稍后再试'; });
  });
})();
</script>
</body>
</html>
